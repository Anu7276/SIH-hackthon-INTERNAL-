<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government of India | Ministry of Ayush</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Preloader Overlay -->
    <div id="loader" class="loader-overlay">
        <div class="loader-content">
            <div class="mandala-spinner"></div>
            <h2 class="loader-title">MINISTRY OF AYUSH</h2>
            <div class="progress-bar-container">
                <div id="loader-progress" class="progress-bar-fill"></div>
            </div>
            <span id="loader-percent" class="loader-percent">0%</span>
        </div>
    </div>

    <!-- Main Hero Landing Container -->
    <div class="video-hero-container" id="hero-container">
        <!-- Canvas for ultra-smooth 60fps Frame Playback -->
        <canvas id="video-canvas"></canvas>

        <!-- Vignette Overlay -->
        <div class="vignette-overlay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
